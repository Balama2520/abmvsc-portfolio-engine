<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" width="1180" height="500" role="img" aria-label="How the Portfolio Engine works: setup.html generates config.js, which script.js reads at runtime to render index.html and studio.html">
  <defs>
    <style>
      .t   { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .m   { font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace; }
      .h1  { font-size: 26px; font-weight: 800; fill: #10264B; }
      .h2  { font-size: 14px; font-weight: 500; fill: #64748B; }
      .ct  { font-size: 16px; font-weight: 700; fill: #10264B; }
      .cs  { font-size: 12.5px; font-weight: 500; fill: #64748B; }
      .mono{ font-size: 12px; font-weight: 500; fill: #2563EB; }
      .lbl { font-size: 12px; font-weight: 600; fill: #FF7900; }
      .band{ font-size: 13px; font-weight: 600; fill: #10264B; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1180" height="500" fill="#F8FAFC"/>

  <!-- Header -->
  <text class="t h1" x="40" y="58">How it works</text>
  <text class="t h2" x="40" y="84">One config file. Two websites. No build step. Zero dependencies.</text>

  <!-- Baseline -->
  <line x1="40" y1="104" x2="1140" y2="104" stroke="#E2E8F0" stroke-width="1"/>

  <!-- 1. Generator -->
  <rect x="40" y="168" width="228" height="132" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="40" y="168" width="228" height="4" rx="2" fill="#38BDF8"/>
  <text class="t ct" x="62" y="204">setup.html</text>
  <text class="t cs" x="62" y="226">Config generator</text>
  <text class="m mono" x="62" y="252">fill a form</text>
  <text class="t cs" x="62" y="278">15 sections · live preview</text>

  <!-- Arrow 1 -->
  <line x1="276" y1="234" x2="332" y2="234" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="t lbl" x="264" y="222">download</text>

  <!-- 2. config.js -->
  <rect x="340" y="168" width="228" height="132" rx="14" fill="#FFFFFF" stroke="#10264B" stroke-width="2"/>
  <rect x="340" y="168" width="228" height="4" rx="2" fill="#FF7900"/>
  <text class="m ct" x="362" y="204">config.js</text>
  <text class="t cs" x="362" y="226">Single source of truth</text>
  <text class="m mono" x="362" y="252">window.PORTFOLIO_CONFIG</text>
  <text class="t cs" x="362" y="278">the only file you edit</text>

  <!-- Arrow 2 -->
  <line x1="576" y1="234" x2="632" y2="234" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="t lbl" x="566" y="222">read at runtime</text>

  <!-- 3. script.js -->
  <rect x="640" y="168" width="228" height="132" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="640" y="168" width="228" height="4" rx="2" fill="#2563EB"/>
  <text class="m ct" x="662" y="204">script.js</text>
  <text class="t cs" x="662" y="226">Hydration engine</text>
  <text class="m mono" x="662" y="252">data-bind · data-list</text>
  <text class="m mono" x="662" y="270">data-section · data-page</text>

  <!-- Arrow 3 (fork) -->
  <line x1="876" y1="234" x2="926" y2="234" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="926" y1="196" x2="926" y2="272" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="926" y1="196" x2="946" y2="196" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="926" y1="272" x2="946" y2="272" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="t lbl" x="878" y="222">renders</text>

  <!-- 4a. index.html -->
  <rect x="954" y="164" width="186" height="64" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <text class="m ct" x="972" y="192">index.html</text>
  <text class="t cs" x="972" y="212">Portfolio · Person</text>

  <!-- 4b. studio.html -->
  <rect x="954" y="240" width="186" height="64" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1.5"/>
  <text class="m ct" x="972" y="268">studio.html</text>
  <text class="t cs" x="972" y="288">Company · Organization</text>

  <!-- SEO band -->
  <rect x="40" y="348" width="1100" height="56" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="68" cy="376" r="5" fill="#2563EB"/>
  <text class="t band" x="86" y="381">SEO injected into &lt;head&gt; at runtime</text>
  <text class="m mono" x="380" y="381">title · meta description · canonical · Open Graph · Twitter Card · JSON-LD</text>

  <!-- Footer notes -->
  <text class="t cs" x="40" y="440">Empty a field and its element hides. Empty an array and the whole section disappears.</text>
  <text class="t cs" x="40" y="462">The engine is never regenerated — it hydrates the same two HTML files on every load.</text>
  <text class="t cs" x="40" y="484">Dev-only tooling: jsdom for tests. The template itself ships with no dependencies.</text>
</svg>
