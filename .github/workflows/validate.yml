name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Engine contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      # The smoke test drives the real generator in Chromium.
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium

      # Covers the hydration contract (test/hydration.test.mjs), the
      # zero-dependency / no-build-step guardrails (test/guardrails.test.mjs)
      # and the end-to-end browser smoke test (test/browser-smoke.test.mjs).
      - name: Run the full test suite
        run: npm test
